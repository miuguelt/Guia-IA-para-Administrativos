name: Calidad de la guía

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- index.html materiales/retos css/course.css js/lab-source-data.js
      - run: npm run check:redaccion
      - run: npm test | tee pruebas-y-cobertura-python.txt
        shell: bash
      - run: npm run test:coverage:all | tee cobertura-completa.txt
        shell: bash
      - run: npm run test:browser:eco
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revision-visual-ecobogota
          path: output/revision-eco/visual
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-completa
          path: cobertura-completa.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pruebas-y-cobertura-python
          path: pruebas-y-cobertura-python.txt
          if-no-files-found: warn
