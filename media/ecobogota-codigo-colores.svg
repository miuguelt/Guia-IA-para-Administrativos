  <text fill="#17211d" font-size="12" font-weight="700" text-anchor="middle" x="51" y="103">BLANCO</text>
  <text fill="#17211d" font-size="12" font-weight="700" text-anchor="middle" x="165" y="103">NEGRO</text>
  <text fill="#17211d" font-size="12" font-weight="700" text-anchor="middle" x="279" y="103">VERDE</text>
